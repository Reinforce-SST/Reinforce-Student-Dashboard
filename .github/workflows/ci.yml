name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend, feat/ledger-web]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Regression tests
        run: npm test

      # The public page must render its configured-state message even when a
      # preview does not have Firebase environment variables.
      - name: Build
        run: npm run build

  e2e:
    name: Web — end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright builds and starts the app itself (see playwright.config.ts)
      # so the bundle under test is built with the same NEXT_PUBLIC_* values the
      # suite mocks against. Every API and Firebase call is intercepted in the
      # browser; the suite reaches no network.
      - name: End-to-end suite
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/.playwright/results
          retention-days: 7

  server:
    name: Server — dependencies, syntax and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Resolve dependencies
        run: uv sync --locked

      - name: Compile check
        run: uv run python -m compileall -q app main.py

      - name: Regression tests
        run: uv run python -m unittest discover -s tests -t .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block credential files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|\.env\.[^e]|.*serviceAccount.*\.json|.*firebase-adminsdk.*\.json|firebase_credentials\.json)'; then
            echo "::error::A credential file is tracked in this repository. Remove it and rotate the key."
            exit 1
          fi
          echo "No credential files tracked."

      # A CI run log (server/error.log) was committed in #35 and shipped for
      # two days. .gitignore cannot help once a file is already tracked, so the
      # guard belongs here.
      - name: Block build and run artifacts
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)[^/]*\.log$|(^|/)next-env\.d\.ts$'; then
            echo "::error::A build or run artifact is tracked. Remove it with 'git rm --cached <path>'."
            exit 1
          fi
          echo "No build or run artifacts tracked."
